name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import en seco (sin claves, sin red)
        env:
          OPENAI_API_KEY: ""
        run: python -c "import nexus; print('ok:', nexus.app.title, nexus.app.version)"
